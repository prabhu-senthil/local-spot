version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: localspot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: localspot
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123

  backend:
    build:
      context: ./server
    container_name: localspot-backend
    restart: unless-stopped
    env_file: ./server/.env
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      MONGO_URL: mongodb://admin:password123@mongodb:27017/localspot?authSource=admin
      JWT_SECRET: super_secret_jwt_key_123
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
    container_name: localspot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"


  ml_service:
    build:
      context: ./ml-service
    container_name: localspot-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: localspot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ml_service




